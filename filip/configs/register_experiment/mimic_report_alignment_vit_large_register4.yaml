experiment_name: mimic_report_alignment_vit_large_register4_sample
dataset_name: mimic
task: report_pretrain
data_config: FILIP-data.md

model:
  vision_encoder: openai/clip-vit-large-patch14
  image_size: 224
  patch_size: 14
  num_registers: 4
  use_feature_alignment: false
  use_report_alignment: true
  text_encoder: openai/clip-vit-large-patch14
  text_max_length: 77
  report_topk: 8
  report_align_dim: 256
  use_jepa: false

loss:
  report_alignment_weight: 1.0
  use_multi_positive: true

training:
  batch_size: 32
  learning_rate: 1.0e-4
  proj_learning_rate: 1.0e-3
  encoder_learning_rate: 1.0e-5
  freeze_encoders: true
  warmup_epochs: 5
  epochs: 8
  use_unique_sampler: true
  weight_decay: 0.01
  mixed_precision: true
  report_to: wandb
