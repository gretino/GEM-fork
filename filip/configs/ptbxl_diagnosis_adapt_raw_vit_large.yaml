experiment_name: ptbxl_adapt_raw_vit_large
dataset_name: ptbxl
task: diagnosis_adapt
data_config: FILIP-data.md
stage1_checkpoint: null

model:
  vision_encoder: openai/clip-vit-large-patch14
  image_size: 224
  patch_size: 14
  use_feature_alignment: true
  diagnosis_from_features: true
  use_adapters: true
  adapter_type: lora

loss:
  diagnosis_loss_weight: 1.0
  feature_consistency_weight: 0.0

training:
  batch_size: 32
  learning_rate: 5.0e-5
  epochs: 10
  mixed_precision: true
  report_to: wandb
