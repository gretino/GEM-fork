experiment_name: vit_large_ptbxl_rhythm_raw_clip_unfreeze2
dataset_name: ptbxl_rhythm
data_root: data/ptbxl_rhythm/
task: diagnosis_adapt
data_config: FILIP-data.md
stage1_checkpoint: null

model:
  vision_encoder: openai/clip-vit-large-patch14
  image_size: 224
  patch_size: 14
  use_feature_alignment: false
  use_report_alignment: false
  diagnosis_mode: class_head
  num_classes: 12
  num_diagnosis: 12

loss:
  diagnosis_loss_weight: 1.0

training:
  batch_size: 32
  unfreeze_last_n_layers: 2
  learning_rate: 3.0e-5
  backbone_lr: 3.0e-5
  head_lr: 3.0e-4
  epochs: 10
  mixed_precision: true
  report_to: wandb
