experiment_name: vit_large_ptbxl_super_raw_clip_frozen
dataset_name: ptbxl_super
data_root: data/ptbxl_super_class/
task: diagnosis_adapt
data_config: FILIP-data.md
stage1_checkpoint: null

model:
  vision_encoder: openai/clip-vit-large-patch14
  image_size: 224
  patch_size: 14
  use_feature_alignment: false
  use_report_alignment: false
  diagnosis_mode: class_head
  num_classes: 5
  num_diagnosis: 5

loss:
  diagnosis_loss_weight: 1.0

training:
  batch_size: 32
  freeze_backbone: true
  learning_rate: 3.0e-5
  head_lr: 3.0e-4
  epochs: 10
  mixed_precision: true
  report_to: wandb
