experiment_name: ptbxl_sub_adapt_asl_morphology
dataset_name: ptbxl
task: diagnosis_adapt
data_config: FILIP-data.md
data_root: data/ptbxl_sub_class/
stage1_checkpoint: outputs/filip/ablation_vit_large_morphology/checkpoints/best.pt

model:
  vision_encoder: openai/clip-vit-large-patch14
  image_size: 224
  patch_size: 14
  use_feature_alignment: true
  diagnosis_from_features: true
  use_adapters: true
  adapter_type: lora
  num_diagnosis: 23

loss:
  diagnosis_loss_weight: 1.0
  feature_consistency_weight: 0
  use_asl: true

training:
  train_split: train
  batch_size: 32
  learning_rate: 3.0e-5
  epochs: 20
  mixed_precision: true
  report_to: wandb
